name: publish
# Runs when a version tag like v1.0.0-beta.1 is pushed, or by hand from the Actions tab.
# Bump the version in gradle.properties and write CHANGELOG.md first.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and publish to Modrinth and CurseForge
        run: ./gradlew build publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      - name: Attach the jars to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          gh release upload "$GITHUB_REF_NAME" $(ls fabric/build/libs/*.jar neoforge/build/libs/*.jar | grep -vE -- '-(sources|javadoc)\.jar$') --clobber
        env:
          GH_TOKEN: ${{ github.token }}
