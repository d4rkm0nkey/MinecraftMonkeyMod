# Publishes to Modrinth and CurseForge as a beta. Start the "publish" job by hand from the pipeline page.
# Needs the CI/CD variables MODRINTH_TOKEN and CURSEFORGE_TOKEN (masked).
image: eclipse-temurin:25-jdk

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

cache:
  key: gradle
  paths:
    - .gradle-home/caches
    - .gradle-home/wrapper

stages:
  - build
  - publish

build:
  stage: build
  script:
    - ./gradlew build
  artifacts:
    paths:
      - fabric/build/libs/*.jar
      - neoforge/build/libs/*.jar

publish:
  stage: publish
  when: manual
  script:
    - ./gradlew build publishMods
